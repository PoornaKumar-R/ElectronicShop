<div class="orders-container">
  <h1 class="title">My Orders</h1>

  <div *ngIf="orders.length === 0" class="no-orders">
    <p>No orders yet</p>
  </div>

  <div *ngIf="orders.length > 0" class="orders-list">
    <div *ngFor="let order of orders" class="order-card">
      <div class="order-header">
        <h3 class="order-id">Order #{{ order.id }}</h3>
        <span class="order-date">{{ order.date | date: 'short' }}</span>
      </div>

      <table class="order-items">
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of order.items" class="item-row">
            <td class="product-name">{{ item.name }}</td>
            <td>{{ item.quantity }}</td>
            <td>₹{{ item.price | number }}</td>
            <td>₹{{ (item.price * item.quantity) | number }}</td>
          </tr>
        </tbody>
      </table>

      <div class="order-footer">
        <span class="order-total">Total: ₹{{ order.total | number }}</span>
      </div>
    </div>
  </div>
</div>
